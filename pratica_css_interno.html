<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aula CSS - 1</title>
</head>
<style>
	.card {
		width:500px; 
		height: fit-content; 
		background-color: aliceblue; 
		border: solid 2px navy; 
		margin: 20px; 
		padding: 40px;
	}

	.border {
		border-radius: 20px;
	}

	.icone1 {
		width: 100px;
		height: 100px;
		background-image: url(https://cdn-icons-png.flaticon.com/512/706/706830.png);
		background-size: cover;
	}

	.text {
		font-size: 30px; 
		margin-top: 20px;
		color: black;
	}

	.title {
		font-size: 30px;
		margin-top: 20px;
		color: black;
	}

	.fonte {
		font-family: Arial, Helvetica, sans-serif;
	}

	.main-color{
		color: navy;
	}

	p {
		font-size: 15px;
		font-style: italic;
	}

	.icone2 {
		width: 100px;
		height: 100px;
		background-image: url(https://cdn-icons-png.flaticon.com/256/3681/3681928.png);
		background-size: cover;
	}
</style>
<body>
	<div class="card border">
		<div class="icone1 border"></div>

		<div>
			<h1 class="title fonte">
				Meu nome é: <span class="main-color"">Adriana</span>
			</h1>

			<p class="fonte">
				Mensagem: A vida não é um morango! E tá tudo bem?
			</p>
		</div>
	</div>

	<div class="card border">
		<div class="icone2 border"></div>

		<div>
			<h1 class="title fonte">
				Meu nome é: <span class="main-color"">Hugo</span>
			</h1>

			<p class="fonte">
				Mensagem: Um dia é da caça, o outro é do caçador.
			</p>
		</div>
	</div>
</body>
</html>
